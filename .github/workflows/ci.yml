name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run check:e2e
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Audit all dependencies (fail on high or critical)
        run: npm audit --audit-level=high
  windows-desktop:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:desktop
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-editor-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
