name: Windows release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and signing certificate
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match package version v$version."
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Configure WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets before publishing."
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:e2e
      - run: npm run dist:win
      - name: Publish signed Windows artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            Get-ChildItem release -File | Where-Object {
              $_.Name -match '\.exe(\.blockmap)?$' -or
              $_.Name -eq 'latest.yml' -or
              $_.Name -eq 'SHA256SUMS.txt'
            } | ForEach-Object { $_.FullName }
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --title "Pixel Editor $version" `
            --generate-notes `
            --verify-tag
